  <div class="app-demo" data-demo>
    <div class="demo-screens" id="demo-screens">
      <figure class="phone-mock" id="screen-backed-up" aria-label="Screen 1 of 4: Backed up">
        <div class="phone-screen">
          <p class="app-bar">Synkurl</p>
          <svg class="app-status" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="27" fill="rgba(255,182,72,0.14)"/><path d="M19 46V28a11 11 0 0 1 22 0v18z" fill="#ffb648"/><path d="M25 35l4 4 7-8" stroke="#1b1405" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <p class="app-big">All backed up</p>
          <p class="app-small">12,480 photos and videos copied to the home device.</p>
          <div class="app-strip">
            <svg viewBox="0 0 40 40"><use href="#pic-cake"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-diya"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-beach"/></svg>
          </div>
          <p class="app-small">Newest: birthday cake, just now</p>
        </div>
        <figcaption>Backed up</figcaption>
      </figure>

      <figure class="phone-mock" id="screen-albums" aria-label="Screen 2 of 4: Albums">
        <div class="phone-screen">
          <p class="app-bar">Albums</p>
          <p class="app-label">Diwali 2025 · 214</p>
          <div class="app-grid">
            <svg viewBox="0 0 40 40"><use href="#pic-diya"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-rangoli"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-flowers"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-chai"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-cake"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-diya"/></svg>
          </div>
          <p class="app-label">Holiday · 386</p>
          <div class="app-grid">
            <svg viewBox="0 0 40 40"><use href="#pic-beach"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-road"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-sunset"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-kite"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-road"/></svg>
            <svg viewBox="0 0 40 40"><use href="#pic-beach"/></svg>
          </div>
        </div>
        <figcaption>Albums</figcaption>
      </figure>

      <figure class="phone-mock" id="screen-away" aria-label="Screen 3 of 4: Away from home">
        <div class="phone-screen">
          <p class="app-pill">Away from home</p>
          <p class="app-big">Your albums are here.</p>
          <ul class="app-list">
            <li><svg viewBox="0 0 40 40"><use href="#pic-diya"/></svg><span>Diwali 2025<small>214</small></span></li>
            <li><svg viewBox="0 0 40 40"><use href="#pic-road"/></svg><span>Holiday<small>386</small></span></li>
            <li><svg viewBox="0 0 40 40"><use href="#pic-cake"/></svg><span>Birthdays<small>97</small></span></li>
            <li><svg viewBox="0 0 40 40"><use href="#pic-kite"/></svg><span>Makar Sankranti<small>45</small></span></li>
          </ul>
        </div>
        <figcaption>Away from home</figcaption>
      </figure>

      <figure class="phone-mock" id="screen-restore" aria-label="Screen 4 of 4: Restore to this phone">
        <div class="phone-screen">
          <p class="app-bar">New phone?</p>
          <svg class="app-status" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="27" fill="rgba(255,182,72,0.14)"/><path d="M19 46V28a11 11 0 0 1 22 0v18z" fill="#ffb648"/></svg>
          <p class="app-big">Your photos are waiting at home.</p>
          <p class="app-small">Copy your saved photos and videos to this phone.</p>
          <p class="app-button">Restore to this phone</p>
        </div>
        <figcaption>Restore to this phone</figcaption>
      </figure>
    </div>
  </div>
  <p class="label-note">Interactive design preview. It does not access or save your photos. The real app may look different.</p>
</section>
