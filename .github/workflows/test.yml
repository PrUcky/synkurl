# Runs the site's tests on every pull request and every push to main.
# A red cross on the pull request means a test failed: look at the log before merging.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synkurl-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: synkurl-site/package-lock.json
      - run: npm ci
      - run: npm run check:site
      - run: npm test
